name: Ready For QA email

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ready-for-qa-email
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Email new Ready For QA tickets
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TARGET_STATUS: ${{ vars.TARGET_STATUS }}
          JQL_FILTER: ${{ vars.JQL_FILTER }}
        run: python3 notify.py

      - name: Remember which tickets were already emailed
        if: always()
        run: |
          [ -f state/sent.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add state/sent.json
          git diff --cached --quiet || { git commit -m "Update sent list" && git push; }
